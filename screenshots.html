<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMagic - Feature Proof Screenshots</title>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            text-align: center;
        }
        h1 { color: #00FF66; font-size: 20px; margin-bottom: 8px; }
        p { color: #8a8a93; font-size: 14px; margin-bottom: 24px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .screenshot-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .label { color: #00FFFF; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        img {
            max-width: 90%;
            width: 360px;
            border: 2px solid #00FF66;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>
    <h1>MyMagic - Microphone Usage Proof</h1>
    <p>The screenshots below demonstrate where and why the application requests microphone access (RECORD_AUDIO) for local offline speech recognition.</p>
    
    <div class="container">
        <!-- БЛОК С ПЕРВЫМ СКРИНШОТОМ -->
        <div class="screenshot-block">
            <div class="label">1. Entry Instruction Screen</div>
            <img src="screen1.jpg" alt="Voice Command Instruction Screen">
        </div>

        <!-- БЛОК СО ВТОРЫМ СКРИНШОТОМ -->
        <div class="screenshot-block">
            <div class="label">2. Main Hall Combat Mode Screen</div>
            <img src="screen2.jpg" alt="Combat Mode Spell Casting Screen">
        </div>
    </div>
</body>
</html>
