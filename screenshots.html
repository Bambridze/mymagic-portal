<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>MyMagic - 麦克风权限使用证明截图</title>
    <style>
        body {
            background-color: #0b0b0f;

            margin: 0;
            padding: 24px;
            text-align: center;
        }
        h1 { color: #00FF66; font-size: 20px; margin-bottom: 8px; }
        p { color: #8a8a93; font-size: 14px; margin-bottom: 24px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .screenshot-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .label { color: #00FFFF; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        img {
            max-width: 90%;
            width: 360px;
            border: 2px solid #00FF66;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

<body>
    <h1>MyMagic - 麦克风权限（RECORD_AUDIO）使用合规证明</h1>

    <div class="container">
        <!-- 第一个截图：入口指令界面 -->
        <div class="screenshot-block">
            <div class="label">1. 入口登录及语音指令说明界面 (Entry Instruction)</div>
