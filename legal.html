<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMagic 🔮 Legal Documentation</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            padding: 24px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #00FF66;
            background-color: rgba(0, 255, 102, 0.05);
            border-radius: 12px;
            padding: 20px;
        }
        h1, h2 {
            color: #00FF66;
        }
        .legal-section {
            margin-bottom: 40px;
            padding: 15px;
            border-bottom: 1.dp solid rgba(0, 255, 102, 0.2);
        }
        /* Скрываем элементы управления Google Translate для нативного вида */
        .goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
        #google_translate_element {
            text-align: right;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="google_translate_element"></div>

    <h1>LEGAL AGREEMENTS</h1>

    <!-- Блок Условий Использования (ToS) -->
    <div id="tos" class="legal-section">
        <h2>1. Terms of Service (ToS)</h2>
        <p>Добро пожаловать... Здесь идет твой текст условий использования на русском языке.</p>
    </div>

    <!-- Блок Политики Конфиденциальности (Privacy) -->
    <div id="privacy" class="legal-section">
        <h2>2. Privacy Policy</h2>
        <p>Мы заботимся о вашей конфиденциальности... Здесь идет твой текст политики на русском языке.</p>
    </div>
</div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru', // Твой исходный текст на сайте
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');

        setTimeout(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const lang = urlParams.get('lang');

            if (lang && lang !== 'ru') {
                const selectEl = document.querySelector('.goog-te-combo');
                if (selectEl) {
                    selectEl.value = lang;
                    selectEl.dispatchEvent(new Event('change'));

                    // Ждем секунду, пока Гугл переведет, и скроллим к нужному якорю (#tos или #privacy)
                    setTimeout(function() {
                        const hash = window.location.hash;
                        if (hash) {
                            const targetEl = document.querySelector(hash);
                            if (targetEl) {
                                targetEl.scrollIntoView({ behavior: 'smooth' });
                            }
                        }
                    }, 1000);
                }
            }
        }, 1000);
    }
</script>

<script type="text/javascript" src="//://google.com"></script>
</body>
</html>
